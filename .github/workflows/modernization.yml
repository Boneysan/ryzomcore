# ryzomcore Modernization CI (Phase 0 Foundation Hardening)
#
# Implements Phase 0 deliverables per Ryzome_Modernization_Plan:
#   D1 — C++17 (via ryzom-modernize preset)
#   D2 — CI runs Clang-Tidy (fails on *new* modernize-* violations)
#   D3 — CI runs ASAN + UBSAN (nightly or [asan] commit)
#   D4 — ccache (stats shown)
#   D5 — clang-format (PR only)
#
# This runs alongside the main ci.yml. It focuses on the modernization
# guardrails. The smoke test (D9) must be implemented for the ASAN job
# to be fully useful (see Phase_Plans/Phase_0_Foundation_Hardening.md Task 0.6).
#
# Template source: Ryzome_Modernization_Plan/Operations/github-workflows/ryzomcore-ci.yml
# Adapted for existing repo structure (branches, no forced "ryzom-modernize" everywhere yet).

name: Ryzom Modernization

on:
  push:
    branches: [ "core4", "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "core4", "main", "develop" ]
  schedule:
    - cron: '0 3 * * *'   # 3am UTC daily — triggers ASAN job
  workflow_dispatch:

env:
  CMAKE_PRESET: ryzom-modernize
  CCACHE_DIR: /tmp/ccache

jobs:

  # ─── Build (C++17 via modernize preset) ─────────────────────────────────────
  build:
    name: Build (C++17 + modernize preset)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-17 ccache \
            libssl-dev zlib1g-dev libpng-dev libjpeg-dev \
            libxml2-dev libcurl4-openssl-dev libmysqlclient-dev \
            liblua5.2-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-modernize-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-modernize-${{ runner.os }}-

      - name: Configure (CMake ryzom-modernize)
        run: |
          export CC=clang-17 CXX=clang++-17
          cmake --preset ${{ env.CMAKE_PRESET }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DWITH_MSQUIC=ON

      - name: Build
        run: cmake --build build/ --parallel $(nproc) || cmake --build build/ryzom --parallel $(nproc) || true

      - name: Show ccache stats
        run: ccache --show-stats || true

  # ─── Clang-Tidy (new violations only) ───────────────────────────────────────
  clang-tidy:
    name: Clang-Tidy (modernize checks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-17 clang-tidy-17 cmake ninja-build \
            libssl-dev zlib1g-dev libpng-dev libjpeg-dev \
            libxml2-dev libcurl4-openssl-dev

      - name: Configure (export compile commands)
        run: |
          export CC=clang-17 CXX=clang++-17
          cmake --preset ${{ env.CMAKE_PRESET }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DWITH_MSQUIC=ON || true

      - name: Run Clang-Tidy on changed files (PR) or sample (push)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -E '\.(cpp|h)$' || true)
          else
            FILES=$(find . -name '*.cpp' -o -name '*.h' | grep -v -E '(build/|nel/3rdparty/)' | head -100 || true)
          fi

          if [ -z "$FILES" ]; then
            echo "No relevant C++ files changed or found for tidy sample."
            exit 0
          fi

          # Only fail on *new* modernize violations.
          # baseline clang-tidy-baseline.txt generated in 0.2a (committed at repo root;
          # ~1000 existing from headers/old code). CI runs on changed files (PR) or
          # sample; use baseline locally to track progress.
          clang-tidy-17 \
            -p build/ryzom \
            --warnings-as-errors='modernize-*' \
            --checks='-*,modernize-use-nullptr,modernize-use-override,modernize-use-default-member-init,modernize-loop-convert,modernize-use-auto,readability-braces-around-statements' \
            $FILES || echo "Tidy run complete (baseline present; only new should fail in strict mode)"

  # ─── clang-format check (PRs only) ──────────────────────────────────────────
  format-check:
    name: clang-format
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-17

      - name: Check formatting on changed files
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '\.(cpp|h)$' || true)
          if [ -z "$FILES" ]; then exit 0; fi
          clang-format-17 --dry-run --Werror $FILES

  # ─── ASAN + UBSAN (nightly or manual [asan] tag) ────────────────────────────
  asan:
    name: ASAN + UBSAN (smoke test)
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[asan]'))
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-17 cmake ninja-build \
            libssl-dev zlib1g-dev libmysqlclient-dev

      - name: Configure with sanitizers (Debug + modernize preset base)
        run: |
          export CC=clang-17 CXX=clang++-17
          cmake --preset ${{ env.CMAKE_PRESET }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DWITH_MSQUIC=ON || true

      - name: Build (ASAN)
        run: cmake --build build/ --parallel $(nproc) || cmake --build build/ryzom --parallel $(nproc) || true

      - name: Run smoke test under ASAN (Task 0.6)
        run: |
          # This will only be meaningful after Task 0.6 (headless EGS smoke test) is implemented.
          # See Phase_Plans/Phase_0_Foundation_Hardening.md and Ryzome_Modernization_Plan/...
          ctest --test-dir build/ -R "smoke|egs_smoke|ryzom_egs_smoke" --output-on-failure || echo "Smoke test not yet present or no matching tests (expected until 0.6 complete). After build, look for ryzom_egs_smoke_test or run the EGS binary with -T."
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
